// ── 방사형 좌표 계산 (직선 spoke) ──
function countLeaves(n){ if(!n.children||!n.children.length){ n._lv=1; return 1; } var s=0; n.children.forEach(function(c){ s+=countLeaves(c); }); n._lv=s; return s; }
countLeaves(TREE);
var RING=170, nodes=[], links=[], idc=0;
function layout(n, depth, a0, a1){
  n._id = idc++;
  var ang=(a0+a1)/2, r=depth*RING;
  var deg = -ang*180/Math.PI, pos='right';
  if(ang>Math.PI/2 && ang<3*Math.PI/2){ deg+=180; pos='left'; }
  nodes.push({
    id:''+n._id, name:n.name, x:r*Math.cos(ang), y:r*Math.sin(ang), url:n.url||'', depth:depth,
    symbolSize: depth===0?16:(depth===1?11:(depth===2?8:6)),
    itemStyle:{ color: depth===0?'#5c3d1e':(depth===1?'#8b5e3c':'#b8860b') },
    label: depth===0
      ? { fontSize:18, fontWeight:'bold', color:'#5c3d1e', position:'top' }
      : { fontSize: depth===1?15:13.5, color:'#1a1814', position:pos, rotate:deg, align: pos==='left'?'right':'left' }
  });
  if(n.children){
    var span=a1-a0, acc=a0;
    n.children.forEach(function(c){
      var cs=span*(c._lv/n._lv);
      layout(c, depth+1, acc, acc+cs);
      acc+=cs;
      links.push({ source:''+n._id, target:''+c._id });
    });
  }
}
layout(TREE, 0, -Math.PI/2, Math.PI*1.5);

var chart = echarts.init(document.getElementById('mindmap'));
chart.setOption({
  tooltip:{ show:true, formatter:function(p){ return p.data && p.data.url ? '클릭하면 이동' : p.name; } },
  series:[{
    type:'graph', layout:'none', roam:true, data:nodes, links:links,
    symbol:'circle',
    lineStyle:{ color:'#cdb89e', width:1, curveness:0 },
    label:{ show:true, fontFamily:"'Noto Sans KR',sans-serif" },
    emphasis:{ focus:'adjacency', lineStyle:{width:2, color:'#9b2335'}, label:{color:'#9b2335'} }
  }]
});
chart.on('click', function(p){ if(p.dataType==='node' && p.data.url){ window.location.href=p.data.url; } });
window.addEventListener('resize', function(){ chart.resize(); });
</script>
