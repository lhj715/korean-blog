<header class="topbar">
  {{- $parts := split .Site.Title " " }}
  <a class="brand" href="{{ "/" | relURL }}">{{ index $parts 0 }}{{ if gt (len $parts) 1 }} <em>{{ index $parts 1 }}</em>{{ end }}</a>
  <nav class="nav">
    {{- $cur := .RelPermalink }}
    {{- range .Site.Menus.main }}
      {{- $u := .URL | relURL }}
      <a href="{{ $u }}"{{ if and (ne $u "/") (hasPrefix $cur $u) }} class="active"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
