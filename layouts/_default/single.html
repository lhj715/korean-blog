{{ define "main" }}
<div class="wrap">
<article>
  <div class="page-header">
    <div class="work-kicker">{{ with .Params.category }}{{ . }}{{ end }}</div>
    <h1>{{ .Title }}</h1>
    {{- if .Params.summary }}<p>{{ .Params.summary }}</p>{{ end }}
  </div>
  {{- if .Params.keywords }}
  <div class="keyword-cloud">{{ range .Params.keywords }}<span class="keyword">{{ . }}</span>{{ end }}</div>
  {{- end }}
  <div class="prose">{{ .Content }}</div>
</article>
</div>
{{ end }}
