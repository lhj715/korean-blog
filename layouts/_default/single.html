{{ define "main" }}
<div class="wrap">
<article>
  <div class="page-header">
    <div class="work-kicker">{{ with .Params.category }}{{ . }}{{ end }}</div>
    <h1>{{ .Title }}</h1>
    {{- with .Params.summary }}<p>{{ . }}</p>{{ end }}
  </div>
  {{- with .Params.keywords }}
  <div class="keyword-cloud">{{ range . }}<span class="keyword">{{ . }}</span>{{ end }}</div>
  {{- end }}
  <div class="prose">{{ .Content }}</div>
</article>
</div>
{{ if eq .Section "exams" }}
<script>
document.addEventListener('click', function(e){
  var a = e.target.closest('a.ev-tag');
  if(!a) return;
  e.preventDefault();
  var optId = (a.getAttribute('href') || '').slice(1);   // 예: q3-5
  var m = optId.match(/^q(\d+)-/);
  if(!m) return;
  var block = document.getElementById('prob' + m[1]);    // 문제 시작 블록
  var opt = document.getElementById(optId);              // 강조할 선지
  if(block){
    var y = block.getBoundingClientRect().top + window.pageYOffset - 70;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }
  if(opt){
    document.querySelectorAll('.opt-hl').forEach(function(el){ el.classList.remove('opt-hl'); });
    opt.classList.add('opt-hl');
  }
});
</script>
{{ end }}
{{ end }}
