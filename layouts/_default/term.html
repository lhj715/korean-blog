{{ define "main" }}
<h1 class="serif">{{ .Title }}</h1>
<p>{{ len .Pages }}개 작품</p>
<table class="work-list">
  <thead><tr><th>작품</th><th>갈래</th><th>작가</th><th>시대</th></tr></thead>
  <tbody>
  {{- range .Pages.ByTitle }}
    <tr onclick="location.href='{{ .RelPermalink }}'" style="cursor:pointer">
      <td><b>{{ .Title }}</b></td>
      <td>{{ .Params.genre }}</td>
      <td>{{ .Params.author }}</td>
      <td>{{ .Params.era }}</td>
    </tr>
  {{- end }}
  </tbody>
</table>
{{ end }}
