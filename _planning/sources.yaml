# 자료 수집 출처 등록부 (readingmap.kr)
# 주기적 수집(RSS형) 대상. collector가 이 파일을 읽어 자료를 가져온다.
# fetch_method: kice_pdf | naver_blog_scrape | rss | ebs | wiki_index | manual
#               | stdict_api | urimalsaem_api | norm_doc   ← 문법 전용(공신력 1·2순위)
# priority: 1(매일) | 2(주간) | 3(월간/수동)

sources:
  # ── 기출 (1차 출처: 공신력) ─────────────────────────────
  - id: kice_suneung
    name: 한국교육과정평가원 (수능/모평)
    type: 기출
    url: https://www.suneung.re.kr/boardCnts/list.do?boardID=1500234&m=0403&s=suneung
    fetch_method: kice_pdf
    collector: teacher-materials/kice/collect.py   # 이미 구현됨, 10개년 보유
    provides: [수능 문제지, 정답표, 모의평가]
    priority: 3
    note: board 1500234=수능, 1500236=모의평가. 학평은 시·도교육청.

  # ── 작품 해설 (네이버 블로그, m.blog 스크래핑) ───────────
  - id: park_jeonhyeon
    name: 국어교사 박전현
    type: 작품해설+변형문제
    blog_id: 9594jh
    url: https://m.blog.naver.com/9594jh
    fetch_method: naver_blog_scrape
    provides: [현대시 해설, 작품별 변형문제(20~40문항), 고전 해설]
    priority: 1
    note: 사용자 추천 핵심 출처. 작품명+문항수 형태. se-main-container 파싱 확인됨.

  - id: solbit
    name: 솔빛국어연구소
    type: 작품해설
    blog_id: koreanbdj
    url: https://m.blog.naver.com/koreanbdj
    fetch_method: naver_blog_scrape
    provides: [EBS 수능특강 작품별 해설/분석, 고전시가, 현대시]
    priority: 2

  - id: gugeo_key
    name: 국어의키
    type: 작품해설
    blog_id: rdpluskey
    url: https://m.blog.naver.com/rdpluskey
    fetch_method: naver_blog_scrape
    provides: [고1 교과서 전 작품 분석/해설, 출판사별 교과서 작품]
    priority: 2
    note: 내신/고1~2 교과서 작품 커버에 유용.

  - id: kimkiju
    name: 김기주 국어 (Ju Class)
    type: 작품해설
    blog_id: bluechip110
    url: https://m.blog.naver.com/bluechip110
    fetch_method: naver_blog_scrape
    provides: [수능특강 현대시/문학 해설·분석]
    priority: 3

  # ── 문법 (1차 출처: 국가 공신력. 문법은 정답이 정해진 영역이라 블로그 금지) ──
  #    원칙: 사실 검증은 반드시 아래 1·2순위로만. m.blog은 '설명 표현' 참고용 보조.
  - id: stdict
    name: 국립국어원 표준국어대사전 오픈 API
    type: 문법-어휘
    url: https://stdict.korean.go.kr/openapi/openApiInfo.do
    fetch_method: stdict_api
    auth: 무료 인증키(API key) 발급 필요 → .env에 STDICT_API_KEY
    provides: [단어 뜻풀이, 품사, 표준 발음, 활용형, 어원, 동의/반의]
    priority: 3
    note: 단어·품사·발음·활용 자료의 1순위 뼈대. 응답 XML/JSON. 단어 차원 사실 검증용.

  - id: urimalsaem
    name: 국립국어원 우리말샘 (개방형 사전)
    type: 문법-어휘
    url: https://www.data.go.kr/data/15019347/openapi.do
    fetch_method: urimalsaem_api
    auth: 공공데이터포털 인증키 → .env에 DATAGO_API_KEY
    provides: [표준국어대사전보다 넓은 어휘, 신어, 문법 정보, 방언, 어원]
    priority: 3
    note: 표준대사전에 없는 어휘 보완용. 사용자 등록 항목 포함이라 표준대사전을 우선.

  - id: book_school_grammar
    name: 「학교 문법과 문법 교육」 (임지룡 외, 박이정 2005)
    type: 문법-개념백본(교재)
    location: Google Drive 도서/국어/학교 문법과 문법 교육.pdf (24MB, fileId 1xdf8YAabvW-pwJuU1S7ZzKaxEYHdyA-I)
    fetch_method: gdrive_read_file_content
    provides: [총론, 언어와 국어, 음운, 형태론, 어휘, 문장, 의미, 이야기(담화), 중세국어, 국어의 변화, 국어 규범]
    chapter_map: "02장→언어단원+훈민정음 / 03장→음운 / 04장→단어 / 06장→문장 / 07장→의미관계 / 08장→담화 / 09·10장→국어사 / 11장→어문규범 / 05장→어휘(신설가능)"
    priority: 1
    caution: >
      저작권 교재 → 통째 복사 금지. 사실·틀만 근거로 우리 말로 재작성.
      read_file_content는 대용량 PDF를 앞부분(~79쪽=02장까지)만 추출함.
      뒷장(음운 83쪽~)은 챕터별로 분할 업로드해야 전체 추출 가능.

  - id: global_encyc_grammar
    name: 글로벌 세계 대백과사전 - 국어 문법 (위키문헌)
    type: 문법-개념백본
    url: https://ko.wikisource.org/wiki/글로벌_세계_대백과사전/언어I·한국문학·논술/작문과_문법/국어_문법
    fetch_method: wiki_index
    license: 공개(위키문헌, public domain) — 저작권 걱정 없이 인용·재구성 가능
    provides: [음운론, 단어(품사론), 문장(문장론) 정의·예시]
    sub_pages: ["문법의 이해", "말소리(음운론)", "단어(품사론)", "문장(문장론)"]
    priority: 2
    note: >
      개념 글의 1차 '내용' 백본(해법문학에 해당). 단, 분류 틀은 옛날 나열식이라
      그대로 쓰지 말 것 → 정의·예시만 취하고 구성은 grammar_system.md의 현행
      4갈래(교체·탈락·첨가·축약)·9품사 체계로 재배열. 첨가/탈락·축약 구분 등
      현대적 분류는 어문규범·기출로 보강.

  - id: korean_norm
    name: 국립국어원 어문 규범 (한글 맞춤법·표준어·표준 발음법·외래어 표기법)
    type: 문법-규범
    url: https://www.korean.go.kr/front/page/pageView.do?page_id=P000099
    fetch_method: norm_doc
    provides: [한글 맞춤법, 표준어 규정, 표준 발음법, 외래어 표기법 규정 원문]
    priority: 3
    note: 규정 원문 자체 = 인용 100% 안전. 맞춤법·띄어쓰기·발음 자료의 2순위 근거.

  - id: kice_grammar
    name: 평가원 기출 + 교재 PDF (문법 개념/이론 근거)
    type: 문법-개념
    fetch_method: kice_pdf
    collector: teacher-materials/kice/collect.py   # 기출 공유, 문법 문항만 추출
    provides: [음운변동, 형태소·품사, 문장성분·문법요소, 국어사 출제 사례]
    priority: 3
    note: 개념/이론은 API에 없음 → 학교문법(교과서)+기출 근거. '교재·원문 근거만, 임의 추정 금지' 원칙을 문법엔 더 엄격 적용.

  # ── 연계교재 / 인덱스 ───────────────────────────────────
  - id: ebsi
    name: EBSi 수능특강·수능완성
    type: 연계교재
    url: https://www.ebsi.co.kr/ebs/pot/potn/retrieveBookSubMain.ebs
    fetch_method: ebs
    provides: [수능특강 문학 목차, 연계 작품 목록]
    priority: 3
    note: 매년 연계교재 작품 목록 = 그 해 최우선 등록 작품 리스트.

  - id: namu_works_list
    name: 나무위키 - 수능 출제 문학작품 목록
    type: 인덱스
    url: https://namu.wiki/w/수능에 출제된 문학작품 목록
    fetch_method: wiki_index
    provides: [수능 출제 작품 마스터 인덱스(작가/연도/갈래)]
    priority: 3
    note: 작품 등록 우선순위 결정용 마스터 체크리스트.

# 네이버 블로그 스크래핑 규칙
naver_blog_scrape_rules:
  url_format: "https://m.blog.naver.com/{blog_id}/{log_no}"   # 반드시 m. 모바일
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1"
  content_selector: "se-main-container"   # SmartEditor ONE
  list_method: 네이버 검색 API(blog.json)로 작품명 검색 → log_no 수집
  rate_limit: 요청 간 2~3초 (봇 차단 회피)
  caution: 저작권. 원문 통째 복제 금지 → 출처 표기 + 자체 재가공/요약 원칙.

# 문법 수집 규칙 (문학과 다름: 정답이 정해진 영역)
grammar_collection_rules:
  concept_backbone: "글로벌세계대백과(위키문헌) — 정의·예시 재료. 구성 틀은 grammar_system.md 현행 체계로 재배열(백과의 옛 나열식 분류 따르지 말 것)."
  fact_verification:
    - "단어·품사·발음·활용 → 국립국어원 API(표준국어대사전·우리말샘)"
    - "맞춤법·띄어쓰기·표준어·표준발음 → 어문 규범 원문"
    - "음운변동 4갈래 분류·첨가·예외·예시 문항 → 평가원 기출 + 현행 학교문법"
  blog_policy: "m.blog은 사실 출처 금지. '쉬운 설명 표현' 참고용 보조로만, 모든 사실은 백과·규범·API로 재검증."
  rationale: "문법은 맞고 틀림이 있어 블로그 오개념 위험이 큼. 문학의 '교재 근거만' 원칙을 더 엄격히 적용."
  category_to_source:    # structure.md 7분류 → 권장 출처
    음운: 어문 규범(표준 발음법) + 기출
    단어: 표준국어대사전 API(품사·활용) + 기출
    문장: 기출 + 교재(학교문법)
    담화: 기출 + 교재
    국어사: 교재 + 평가원 기출
    어문규정: 어문 규범 원문(맞춤법·표준어·외래어) ← 가장 안전
  todo:
    - "표준국어대사전 인증키 발급 → .env STDICT_API_KEY"
    - "어문 규범 원문 4종 로컬 저장(인용 근거용)"
    - "collect.py에서 문법 문항만 추출하는 필터 추가"
