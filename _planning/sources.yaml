# 자료 수집 출처 등록부 (readingmap.kr)
# 주기적 수집(RSS형) 대상. collector가 이 파일을 읽어 자료를 가져온다.
# fetch_method: kice_pdf | naver_blog_scrape | rss | ebs | wiki_index | manual
# priority: 1(매일) | 2(주간) | 3(월간/수동)

sources:
  # ── 기출 (1차 출처: 공신력) ─────────────────────────────
  - id: kice_suneung
    name: 한국교육과정평가원 (수능/모평)
    type: 기출
    url: https://www.suneung.re.kr/boardCnts/list.do?boardID=1500234&m=0403&s=suneung
    fetch_method: kice_pdf
    collector: teacher-materials/kice/collect.py   # 이미 구현됨, 10개년 보유
    provides: [수능 문제지, 정답표, 모의평가]
    priority: 3
    note: board 1500234=수능, 1500236=모의평가. 학평은 시·도교육청.

  # ── 작품 해설 (네이버 블로그, m.blog 스크래핑) ───────────
  - id: park_jeonhyeon
    name: 국어교사 박전현
    type: 작품해설+변형문제
    blog_id: 9594jh
    url: https://m.blog.naver.com/9594jh
    fetch_method: naver_blog_scrape
    provides: [현대시 해설, 작품별 변형문제(20~40문항), 고전 해설]
    priority: 1
    note: 사용자 추천 핵심 출처. 작품명+문항수 형태. se-main-container 파싱 확인됨.

  - id: solbit
    name: 솔빛국어연구소
    type: 작품해설
    blog_id: koreanbdj
    url: https://m.blog.naver.com/koreanbdj
    fetch_method: naver_blog_scrape
    provides: [EBS 수능특강 작품별 해설/분석, 고전시가, 현대시]
    priority: 2

  - id: gugeo_key
    name: 국어의키
    type: 작품해설
    blog_id: rdpluskey
    url: https://m.blog.naver.com/rdpluskey
    fetch_method: naver_blog_scrape
    provides: [고1 교과서 전 작품 분석/해설, 출판사별 교과서 작품]
    priority: 2
    note: 내신/고1~2 교과서 작품 커버에 유용.

  - id: kimkiju
    name: 김기주 국어 (Ju Class)
    type: 작품해설
    blog_id: bluechip110
    url: https://m.blog.naver.com/bluechip110
    fetch_method: naver_blog_scrape
    provides: [수능특강 현대시/문학 해설·분석]
    priority: 3

  # ── 연계교재 / 인덱스 ───────────────────────────────────
  - id: ebsi
    name: EBSi 수능특강·수능완성
    type: 연계교재
    url: https://www.ebsi.co.kr/ebs/pot/potn/retrieveBookSubMain.ebs
    fetch_method: ebs
    provides: [수능특강 문학 목차, 연계 작품 목록]
    priority: 3
    note: 매년 연계교재 작품 목록 = 그 해 최우선 등록 작품 리스트.

  - id: namu_works_list
    name: 나무위키 - 수능 출제 문학작품 목록
    type: 인덱스
    url: https://namu.wiki/w/수능에 출제된 문학작품 목록
    fetch_method: wiki_index
    provides: [수능 출제 작품 마스터 인덱스(작가/연도/갈래)]
    priority: 3
    note: 작품 등록 우선순위 결정용 마스터 체크리스트.

# 네이버 블로그 스크래핑 규칙
naver_blog_scrape_rules:
  url_format: "https://m.blog.naver.com/{blog_id}/{log_no}"   # 반드시 m. 모바일
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1"
  content_selector: "se-main-container"   # SmartEditor ONE
  list_method: 네이버 검색 API(blog.json)로 작품명 검색 → log_no 수집
  rate_limit: 요청 간 2~3초 (봇 차단 회피)
  caution: 저작권. 원문 통째 복제 금지 → 출처 표기 + 자체 재가공/요약 원칙.
