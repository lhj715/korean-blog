baseURL = 'https://readingmap.kr/'
title = '독서지도 · readingmap.kr'

[languages.ko]
  label = '한국어'
  locale = 'ko_KR'
defaultContentLanguage = 'ko'
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 24

# 다축 분류 — 작품 하나를 갈래·작가·시대·학년·출제이력으로 동시 태깅
[taxonomies]
  genre = 'genres'
  author = 'authors'
  era = 'eras'
  grade = 'grades'
  appearance = 'appearances'

[params]
  description = "고1~고3 국어 학습 아카이브 — 문학 작품·문법·수능 기출 자료실"
  subtitle = "문학 · 문법 · 기출을 한 장의 지도로"

# 상위 메뉴
[[menu.main]]
  name = '문학'
  url = '/literature/'
  weight = 10
[[menu.main]]
  name = '문법'
  url = '/grammar/'
  weight = 20
[[menu.main]]
  name = '기출'
  url = '/exams/'
  weight = 30
[[menu.main]]
  name = '작가'
  url = '/authors/'
  weight = 40
[[menu.main]]
  name = '검색'
  url = '/search/'
  weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
