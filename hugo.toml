baseURL = 'https://readingmap.kr/'
languageCode = 'ko-kr'
title = '한국 문학 연표'
defaultContentLanguage = 'ko'
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true

[params]
  description = "수능·내신 대비 한국 문학 연표 — 시대·장르·작품 드릴다운 아카이브"
  keywords = ["수능 국어", "한국 문학", "고전 문학", "현대 문학", "문학 연표", "EBS 수능특강"]
  author = "readingmap.kr"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
