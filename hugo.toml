baseURL = 'https://readingmap.kr/'
languageCode = 'ko-kr'
title = 'readingmap.kr'
theme = 'PaperMod'

defaultContentLanguage = 'ko'
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true

[params]
  env = 'production'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  ShowFullTextinRSS = false
  description = "고등학교 국어교사가 운영하는 수능 기출 해설·작품 정리·수업 자료 아카이브"
  keywords = ["수능 국어", "기출 해설", "고등 국어", "문학 작품", "EBS 수능특강"]

[params.homeInfoParams]
  Title = "수능 국어를 지도처럼 읽다"
  Content = "고등학교 국어교사가 운영하는 **기출 해설 · 작품 정리 · 수업 자료** 아카이브"

[params.assets]
  disableHLJS = false
  favicon = "/favicon.ico"

[[menu.main]]
  identifier = "기출"
  name = "기출"
  url = "/categories/기출/"
  weight = 10

[[menu.main]]
  identifier = "작품"
  name = "작품"
  url = "/categories/작품/"
  weight = 20

[[menu.main]]
  identifier = "수업"
  name = "수업"
  url = "/categories/수업/"
  weight = 30

[[menu.main]]
  identifier = "태그"
  name = "태그"
  url = "/tags/"
  weight = 40

[[menu.main]]
  identifier = "검색"
  name = "검색"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
